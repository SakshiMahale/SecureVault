{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <h3 class="text-center mb-3">Upload File</h3>

            <form method="POST" action="/upload" enctype="multipart/form-data">

                <div class="mb-3">
                    <label>Select File</label>
                    <input type="file" name="file" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label>File Password</label>
                    <input type="password" name="file_password" class="form-control" required>
                </div>

                <button type="submit" class="btn btn-success w-100">
                    Encrypt & Upload
                </button>

            </form>

            <a href="/dashboard" class="btn btn-secondary w-100 mt-3">
                Back to Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}

{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <h3 class="text-center mb-3">Upload File</h3>
            <form enctype="multipart/form-data">
                <div class="mb-3">
                    <input type="file" class="form-control" required>
                </div>

                <button class="btn btn-success w-100">Encrypt & Upload</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}

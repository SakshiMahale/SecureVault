{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card p-4">
            <h4 class="text-center mb-3">Enter File Password</h4>

            {% if error == "wrong_password" %}
                <div class="alert alert-danger">
                    Incorrect file password!
                </div>
            {% endif %}

            {% if error == "expired" %}
                <div class="alert alert-warning">
                    File access session expired. Please click Download again.
                </div>
            {% endif %}

            <form method="POST">
                <input type="hidden" name="filename" value="{{ filename }}">

                <div class="mb-3">
                    <label>File Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>

                <button class="btn btn-primary w-100">Access File</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
